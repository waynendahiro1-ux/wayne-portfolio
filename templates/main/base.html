<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Portfolio{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }
        a {
            color: #22d3ee;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #a78bfa;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
            width: 100%;
        }
        /* Navbar */
        nav {
            background: #1e293b;
            padding: 1rem 0;
            border-bottom: 1px solid #334155;
        }
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: #22d3ee;
        }
        .nav-links a {
            margin-left: 1.5rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        .nav-links a:hover {
            color: #22d3ee;
        }
        /* Main content */
        main {
            flex: 1;
            padding: 3rem 0;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        h1 {
            font-size: 2.4rem;
            margin-bottom: 1rem;
            color: #f1f5f9;
        }
        h2 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            color: #22d3ee;
        }
        p {
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
        .btn {
            display: inline-block;
            background: #22d3ee;
            color: #0f172a;
            padding: 0.75rem 1.8rem;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 1rem;
            transition: background 0.2s, transform 0.2s;
        }
        .btn:hover {
            background: #a78bfa;
            color: white;
            transform: translateY(-2px);
        }
        /* Footer */
        footer {
            background: #1e293b;
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid #334155;
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    {% include 'main/includes/navbar.html' %}

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% include 'main/includes/footer.html' %}
</body>
</html>
