
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Wayne | Portfolio{% endblock %}</title>
    <meta name="description"
          content="Wayne's portfolio in computer science, technology and entrepreneurship.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08111f;
            color: #f1f5f9;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: 80%;
            max-width: 1100px;
            margin: auto;
        }

        nav {
            background: #0d192a;
            border-bottom: 1px solid #233249;
            padding: 20px 0;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: #60a5fa;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            list-style: none;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .hero {
            padding: 100px 0;
            background: radial-gradient(
                ellipse at top right, #15365b, #08111f 70%
            );
        }

        .tag {
            color: #60a5fa;
            font-weight: bold;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(38px, 6vw, 68px);
            line-height: 1.15;
            margin-bottom: 20px;
        }

        h1 span {
            color: #60a5fa;
        }

        p {
            color: #b8c5d6;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 650px;
        }

        .button {
            display: inline-block;
            background: #2563eb;
            padding: 11px 20px;
            border-radius: 6px;
            font-weight: bold;
        }

        .button:hover {
            background: #3b82f6;
        }

        section {
            padding: 65px 0;
        }

        .section-dark {
            background: #0d192a;
        }

        .section-title {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .cards {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: #101f33;
            border: 1px solid #263951;
            border-radius: 10px;
            padding: 24px;
        }

        .card h3 {
            color: #93c5fd;
            margin-bottom: 10px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .skill {
            background: #10243a;
            border: 1px solid #355171;
            border-radius: 20px;
            padding: 7px 14px;
            color: #bfdbfe;
        }

        footer {
            text-align: center;
            padding: 25px 0;
            border-top: 1px solid #233249;
            background: #0d192a;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 650px) {
            .container {
                width: 88%;
            }

            .nav-content {
                flex-direction: column;
            }

            .nav-links {
                gap: 14px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero {
                padding: 70px 0;
            }
        }
    </style>
</head>

<body>
    {% include 'main/includes/navbar.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'main/includes/footer.html' %}
</body>
</html>
